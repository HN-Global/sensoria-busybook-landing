<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://start.sensoria.kr/reviews/" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:title" content="조이캣 비지북 구매평 406건" />
<meta property="og:image" content="https://start.sensoria.kr/og.jpg" />
<title>조이캣 비지북 구매평</title>
<style>
  :root { --ink:#241f1a; --dim:#6d6459; --line:#ece6dd; --pink:#d9566b; --soft:#fbf1f2; --paper:#fff; --ground:#f4f1ec; --star:#f5a623; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .page { max-width: 860px; margin-inline: auto; background: var(--paper); min-height: 100vh; padding: 0 16px 32px; }
  .gnb { position: sticky; top: 0; z-index: 40; height: 60px; background: #ffe6e4; margin: 0 -16px;
    display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 0 6px; }
  .gnb a { display: flex; align-items: center; justify-content: center; height: 48px; color: #3a2b2b; text-decoration: none; }
  .gnb img { height: 40px; width: auto; display: block; }
  .gnb svg { width: 24px; height: 24px; }
  .back { display: inline-block; margin-top: 14px; color: var(--dim); font-size: 13px; text-decoration: none; }
  h1 { font-size: 20px; margin: 20px 0 14px; letter-spacing: -.02em; }
  .sum { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
    padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fffaf6; }
  .sum__score { text-align: center; }
  .sum__score b { display: block; font-size: 34px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stars { color: var(--star); letter-spacing: 1px; }
  .sum__score small { display: block; font-size: 12px; color: var(--dim); margin-top: 4px; }
  .bars { display: grid; gap: 5px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { display: grid; grid-template-columns: 2.4em 1fr 3em; gap: 8px; align-items: center; }
  .bar i { display: block; height: 7px; border-radius: 9px; background: var(--line); overflow: hidden; }
  .bar i > u { display: block; height: 100%; background: var(--star); }
  .bar span:last-child { text-align: right; }
  .note { margin: 14px 0 18px; padding: 12px 14px; border-radius: 12px; background: var(--soft);
    font-size: 13px; line-height: 1.7; color: #6b3a43; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); color: var(--dim); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
  .card__head { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .card__src { margin-left: auto; font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .card__imgs { display: flex; gap: 6px; flex-wrap: wrap; }
  .card__imgs img { width: 92px; height: 92px; object-fit: cover; border-radius: 8px; background: var(--ground); }
  .card__text { font-size: 14px; line-height: 1.7; white-space: pre-line; overflow-wrap: anywhere; }
  .card:not(.is-open) .card__text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
  .card__more { align-self: flex-start; font: inherit; font-size: 13px; color: var(--pink); font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; }
  .card__meta { font-size: 12px; color: var(--dim); margin-top: auto; }
  .more { display: block; margin: 18px auto 0; font: inherit; font-size: 15px; font-weight: 700; padding: 13px 28px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
  .fbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
  .fbar a { display: block; text-decoration: none; text-align: center; border-radius: 9px; padding: 11px 8px; font-size: 14.5px; font-weight: 800; line-height: 1.25; }
  .fbar small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
  .b-back { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); }
  .b-buy { background: var(--pink); color: #fff; }
  a:focus-visible, button:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  @media (min-width: 900px) { .fbar { left: 50%; right: auto; width: 860px; transform: translateX(-50%); } }
  @media (max-width: 380px) { .sum { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="page">
  <header class="gnb">
    <a href="/" aria-label="3종 세트로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a href="/" aria-label="조이캣"><img src="/assets/joycat-logo.png" width="103" height="66" alt="joycat" /></a>
    <a href="https://sensoria.kr/shop_view/?idx=28" aria-label="구매하기" data-cta="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 10.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="10" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></a>
  </header>
  <a class="back" href="/">← 3종 세트 소개로 돌아가기</a>
  <h1 style="margin-top:8px">구매평 406건</h1>

  <section class="sum" aria-label="평점 요약">
    <div class="sum__score"><b>4.96</b><span class="stars" aria-hidden="true">★★★★★</span><small>5점 만점</small></div>
    <div class="bars" id="bars"></div>
  </section>

  <p class="note">3종 세트에 들어 있는 <b>프린세스</b>를 쿠팡에서 구매한 고객의 구매평이에요.
    평점과 건수는 406건 전부로 계산했고, 별점만 남긴 217건과 이벤트 안내 문구만 있는 1건은 목록에서 뺐어요.</p>

  <div class="tabs" role="group" aria-label="구매평 거르기">
    <button type="button" id="fAll" aria-pressed="true">전체 <span id="nAll"></span></button>
    <button type="button" id="fPhoto" aria-pressed="false">사진 <span id="nPhoto"></span></button>
  </div>

  <div class="grid" id="grid"></div>
  <button type="button" class="more" id="more">구매평 더 보기</button>
</main>

<nav class="fbar">
  <a class="b-back" href="/">상세 보기<small>3종 세트 소개</small></a>
  <a class="b-buy" data-cta="buy" href="https://sensoria.kr/shop_view/?idx=28">구매하러 가기<small>144,000원 · 무료배송</small></a>
</nav>

<script src="./reviews-data.js"></script>
<script>
(function () {
  var D = window.JC_REVIEWS, PAGE = 20, shown = 0, list = D.items, photoOnly = false;
  var grid = document.getElementById('grid'), more = document.getElementById('more');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function stars(n) { return '★★★★★'.slice(0, n) + '<span style="color:#e3ddd3">' + '★★★★★'.slice(n) + '</span>'; }
  var bars = ''; [5,4,3,2,1].forEach(function (s) {
    var n = D.dist[s] || 0, p = n / D.total * 100;
    bars += '<div class="bar"><span>' + s + '점</span><i><u style="width:' + p.toFixed(1) + '%"></u></i><span>' + n + '</span></div>';
  });
  document.getElementById('bars').innerHTML = bars;
  document.getElementById('nAll').textContent = D.items.length;
  document.getElementById('nPhoto').textContent = D.photo;
  function card(x) {
    var imgs = x.images.length ? '<div class="card__imgs">' + x.images.map(function (u) {
      return '<img src="' + esc(u) + '" alt="구매평 사진" loading="lazy" decoding="async" referrerpolicy="no-referrer" />'; }).join('') + '</div>' : '';
    return '<article class="card"><div class="card__head"><span class="stars">' + stars(x.rating) + '</span>' +
      '<span class="card__src">쿠팡 · 프린세스</span></div>' + imgs +
      '<p class="card__text">' + esc(x.content) + '</p>' +
      (x.content.length > 150 ? '<button type="button" class="card__more">더 보기</button>' : '') +
      '<div class="card__meta">' + esc(x.name) + ' · ' + esc(x.date) + '</div></article>';
  }
  function render(reset) {
    if (reset) { grid.innerHTML = ''; shown = 0; }
    var src = photoOnly ? list.filter(function (x) { return x.images.length; }) : list;
    grid.insertAdjacentHTML('beforeend', src.slice(shown, shown + PAGE).map(card).join(''));
    shown = Math.min(shown + PAGE, src.length);
    more.hidden = shown >= src.length;
  }
  render(true);
  more.addEventListener('click', function () { render(false); });
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('.card__more'); if (!b) return;
    var c = b.closest('.card'); c.classList.toggle('is-open'); b.textContent = c.classList.contains('is-open') ? '접기' : '더 보기';
  });
  function setF(p) { photoOnly = p;
    document.getElementById('fAll').setAttribute('aria-pressed', !p);
    document.getElementById('fPhoto').setAttribute('aria-pressed', p); render(true); }
  document.getElementById('fAll').onclick = function () { setF(false); };
  document.getElementById('fPhoto').onclick = function () { setF(true); };

  // 계측 — 메인 랜딩과 같은 속성·이름. 여기서는 view_item 을 다시 쏘지 않는다(메인에서 이미 셈).
  var GA = 'G-JMM010XK8T', PX = '2177455709866933';
  var P = { id: '28', name: '조이캣 비지북 3종 세트 (프린세스·오션·정글)', price: 144000 };
  function start() {
    window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', GA);
    var g = document.createElement('script'); g.async = true; g.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA; document.head.appendChild(g);
    (function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
      t = b.createElement(e); t.async = true; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
    })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', PX); fbq('track', 'PageView');
  }
  if (document.readyState === 'complete') start(); else window.addEventListener('load', start);
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-cta="buy"]'); if (!el) return;
    if (window.fbq) fbq('trackCustom', 'ClickBuyNow', { content_name: P.name, content_ids: [P.id], content_type: 'product', value: P.price, currency: 'KRW' });
    if (window.gtag) gtag('event', 'click_buy_now', { currency: 'KRW', value: P.price, items: [{ item_id: P.id, item_name: P.name, price: P.price }], transport_type: 'beacon' });
  });
})();
</script>
</body>
</html>
