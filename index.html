<title>조이캣 비지북 3종 세트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
<style>
  /* 진짜 랜딩 자리. 블록이 하나씩 확정되는 대로 여기에 들어온다.
     계측과 구매 동선은 지금부터 붙여 둔다 - 나중에 붙이면 그때부터
     숫자가 시작돼서 그 전 기간과 비교를 못 한다. */
  :root {
    --paper: #f4f1ec; --card: #fff; --ink: #241f1a; --ink-dim: #6d6459;
    --line: #ddd6cb; --pink: #d9566b;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 92px;
  }
  .wrap { max-width: 420px; margin-inline: auto; padding: 56px 16px 32px; }
  h1 {
    margin: 0 0 12px; font-family: "Gowun Dodum", "Noto Sans KR", sans-serif;
    font-size: 26px; line-height: 1.35; letter-spacing: -.02em;
  }
  p { margin: 0 0 12px; font-size: 14px; line-height: 1.7; color: var(--ink-dim); }
  .price { margin: 22px 0 6px; font-size: 15px; }
  .price s { color: var(--ink-dim); margin-right: 8px; }
  .price b { font-size: 24px; }
  .links { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); }
  .links a { color: var(--ink); font-size: 13px; display: block; margin-bottom: 8px; }

  /* 플로팅 바 — 구매 동선은 지금부터 산다 */
  .fbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    padding: 9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
    background: var(--ink);
    display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px;
  }
  .fbtn {
    display: block; text-decoration: none; text-align: center;
    border-radius: 9px; padding: 12px 8px; font-size: 14px;
    font-weight: 700; line-height: 1.25;
  }
  .fbtn small { display: block; font-weight: 400; font-size: 10.5px; opacity: .78; }
  .fbtn--buy { background: var(--pink); color: #fff; }
  .fbtn--rv { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); }
</style>
</head>
<body>

<div class="wrap">
  <h1>조이캣 비지북<br />3종 세트</h1>
  <p>프린세스 &middot; 오션 &middot; 정글. 세 가지를 한 번에.</p>
  <div class="price"><s>207,000원</s><b>144,000원</b></div>
  <p>무료배송</p>

  <p style="margin-top:28px">이 페이지는 제작 중입니다. 구성과 문구가 확정되는 대로 여기에 들어옵니다.</p>

  <div class="links">
    <a href="/frame/">기획 프레임 보기 (내부 검토용)</a>
    <a href="/scroll-demo/">스크롤 연동 애니메이션 예시</a>
  </div>
</div>

<nav class="fbar">
  <a class="fbtn fbtn--buy" data-cta="buy" target="_blank" rel="noopener"
     href="https://sensoria.kr/shop_view?idx=28">구매하러 가기<small>144,000원 · 무료배송</small></a>
  <a class="fbtn fbtn--rv" href="#reviews">리뷰 확인하기<small>406건 · 4.96점</small></a>
</nav>

<!-- 계측: GA4 · Clarity · 메타 픽셀. 지표 세션이 준 값 그대로.
     전부 load 이후에 띄운다 - 루딕스·SHL 과 같은 방식이라 숫자를 나란히 놓고 볼 수 있다.
     상점으로 가는 버튼에는 UTM 을 붙이지 않는다. 붙이면 GA4 가 세션 중간에
     새 캠페인으로 보고 세션을 끊어, 랜딩에서 구매까지의 연결이 끊긴다. -->
<script>
(function () {
  var GA  = 'G-JMM010XK8T';          // 조이캣 속성 (자사몰·티스토리와 같은 스트림)
  var CL  = 'ytykxcqdr0';            // Clarity '조이캣 랜딩'
  var PX  = '2177455709866933';      // 센소리아 픽셀 (자사몰과 공용)

  // 이 랜딩이 파는 것. item_id 는 자사몰이 보내는 값과 같아야 한다 —
  // 아임웹이 상품 idx 를 문자열로 보내므로 여기서도 문자열 '28' 이다.
  // 숫자 28 로 보내면 GA 에서 다른 상품처럼 갈라진다.
  var P = {
    id:    '28',
    name:  '조이캣 비지북 3종 세트 (프린세스·오션·정글)',
    price: 144000
  };
  function gaItems() {
    return [{ item_id: P.id, item_name: P.name, price: P.price }];
  }
  function pxItem() {
    return { content_name: P.name, content_ids: [P.id],
             content_type: 'product', value: P.price, currency: 'KRW' };
  }

  function start() {
    // ── GA4 ──────────────────────────────────────────────────────────
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', GA);
    var g = document.createElement('script');
    g.async = true;
    g.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA;
    document.head.appendChild(g);

    // ── Clarity ──────────────────────────────────────────────────────
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
      t = l.createElement(r); t.async = 1;
      t.src = 'https://www.clarity.ms/tag/' + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, 'clarity', 'script', CL);

    // ── 메타 픽셀 ────────────────────────────────────────────────────
    (function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
      t = b.createElement(e); t.async = true; t.src = v;
      s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
    })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', PX);
    fbq('track', 'PageView');

    // 상품 조회 — 랜딩 진입 시 1회. 루딕스·SHL 과 같은 모양으로 보낸다.
    // 자사몰 상품페이지에서도 view_item 이 나가 같은 사람이 두 번 쏘지만,
    // 지표 쪽에서 hostName 으로 갈라 본다(start.* = 랜딩).
    gtag('event', 'view_item',
         { currency: 'KRW', value: P.price, items: gaItems() });
    fbq('track', 'ViewContent', pxItem());
  }

  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);

  // ── 구매 버튼 ──────────────────────────────────────────────────────
  // 이름은 루딕스·SHL 과 똑같이 쓴다. 세 랜딩을 한 퍼널로 보려면 같아야 한다.
  // 표준 이벤트(InitiateCheckout 등)는 쓰지 않는다. 자사몰이 진짜 결제
  // 이벤트를 쏘고 있어서, 섞이면 광고 최적화가 엉뚱한 걸 배운다.
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-cta="buy"]');
    if (!el) return;
    if (window.fbq) fbq('trackCustom', 'ClickBuyNow', pxItem());
    if (window.gtag) gtag('event', 'click_buy_now',
      { currency: 'KRW', value: P.price, items: gaItems() });
  });
})();
</script>

</body>
</html>
